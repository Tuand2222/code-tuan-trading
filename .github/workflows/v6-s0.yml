name: Verify unified journal
on:
  pull_request:
    paths: ['v6/**', 'worker/**', 'scripts/**', '.github/workflows/v6-s0.yml']
  push:
    branches: [main, 'fix/**']
    paths: ['v6/**', 'worker/**', 'scripts/**', '.github/workflows/v6-s0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: v6/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: unified-html
          path: v6/dist/
